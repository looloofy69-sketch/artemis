name: Android Runtime APK

on:
  push:
    paths:
      - "packages/artemis-accessibility-helper/**"
      - ".github/workflows/android-runtime.yml"
  pull_request:
    paths:
      - "packages/artemis-accessibility-helper/**"
      - ".github/workflows/android-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Runtime debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/artemis-accessibility-helper

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: artemis-runtime-debug-apk
          path: packages/artemis-accessibility-helper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
